openapi: 3.0.3

info:
  title: Booking Service API
  version: "1.0.0"
  description: |
    Manages the bookings of the users.

    ## Authentication (JWT)
    Get a token with `POST /login` on the User service (port 3203), then send it
    on every request: `Authorization: Bearer <token>`.
    The token is checked locally with the shared secret `JWT_SECRET`.

    - `401`: the token is missing, invalid or expired.
    - `403`: the token is valid, but the operation needs the `admin` role, or a
      client is trying to access another user's bookings.
  contact:
    name: Mbungai Francesco

servers:
  - url: http://localhost:3201
    description: Local development server

tags:
  - name: client
    description: Operations on the caller's own bookings (or any user's, for an admin)
  - name: admin
    description: Secured admin-only calls

security:
  - bearerAuth: []

paths:
  /:
    get:
      tags: [client]
      summary: Service home page
      operationId: home
      security: []
      responses:
        "200":
          description: HTML welcome message
          content:
            text/html:
              schema:
                type: string
                example: "<h1 style='color:blue'>Welcome to the Booking service!</h1>"

  /bookings:
    get:
      tags: [admin]
      summary: Get the bookings of all users
      operationId: getAllBookings
      responses:
        "200":
          description: All bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserBookings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /bookings/{userid}:
    parameters:
      - $ref: "#/components/parameters/UserId"

    get:
      tags: [client]
      summary: Get the bookings of a user (owner or admin)
      operationId: getUserBookings
      responses:
        "200":
          description: Bookings of the user (`dates` is empty when there are none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBookings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [client]
      summary: Book a movie on a date (owner or admin)
      description: |
        Steps:
        1. Check the slot with the Schedule service:
           `GET /schedules/{date}/movies/{movieid}` (200 = OK, 404 = no such slot).
        2. Refuse the booking if the user already booked this movie on this date.
        3. Add the movie to the user's date (the date and the user entry are
           created when they don't exist yet) and save bookings.json.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
            example:
              date: "20151201"
              movieid: 267eedb8-0f5d-42d5-8f43-72426b9fb3e6
      responses:
        "201":
          description: Booking created. Returns the updated bookings of the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBookings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The user already booked this movie on this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: booking already exists
        "422":
          description: The movie is not shown on this date (the Schedule service returned 404)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: this movie is not scheduled on 20151201
        "502":
          $ref: "#/components/responses/BadGateway"

    delete:
      tags: [admin]
      summary: Delete all the bookings of a user
      description: Useful when a user account is deleted on the User service.
      operationId: deleteUserBookings
      responses:
        "200":
          description: Bookings deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: bookings deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{userid}/{date}/{movieid}:
    delete:
      tags: [client]
      summary: Cancel one booking (owner or admin)
      operationId: deleteBooking
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Date"
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: Booking cancelled. Returns the updated bookings of the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBookings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


  /bookings/{userid}/details:
    get:
      tags: [client]
      summary: "[extra] Get the bookings of a user with the movie details (owner or admin)"
      description: Calls the Movie service (`GET /movies/{movieid}`) for each booked movie.
      operationId: getDetailedBookings
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Detailed bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedUserBookings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /bookings/movies/{movieid}:
    get:
      tags: [admin]
      summary: "[extra] Get the users who booked a movie"
      description: Returns, for each date, the users who booked the movie. Useful before deleting a movie.
      operationId: getBookingsForMovie
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: Bookings of this movie (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieBookings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  # JWT issued by the User service
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT from `POST /login` on the User service. Header: `Authorization: Bearer <token>`"

  parameters:
    UserId:
      name: userid
      in: path
      required: true
      description: User id (username)
      schema:
        type: string
      example: garret_heaton
    Date:
      name: date
      in: path
      required: true
      description: Date in the format YYYYMMDD
      schema:
        type: string
        pattern: '^\d{8}$'
      example: "20151201"
    MovieId:
      name: movieid
      in: path
      required: true
      description: Movie id (UUID)
      schema:
        type: string
      example: 267eedb8-0f5d-42d5-8f43-72426b9fb3e6

  responses:
    BadRequest:
      description: The request body is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "missing field: movieid"
    Unauthorized:
      description: The JWT is missing, invalid or expired
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: token is missing or invalid
    Forbidden:
      description: The operation needs the admin role, or the bookings belong to another user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: forbidden
    NotFound:
      description: No booking found for this user / date / movie
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: booking not found
    BadGateway:
      description: The Schedule or Movie service is down or returned an unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Schedule service unavailable

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    BookingRequest:
      type: object
      required: [date, movieid]
      properties:
        date:
          type: string
          pattern: '^\d{8}$'
          example: "20151201"
        movieid:
          type: string
          example: 267eedb8-0f5d-42d5-8f43-72426b9fb3e6

    BookedDate:
      type: object
      required: [date, movies]
      properties:
        date:
          type: string
          example: "20151201"
        movies:
          type: array
          items:
            type: string
          example: [267eedb8-0f5d-42d5-8f43-72426b9fb3e6]

    UserBookings:
      type: object
      required: [userid, dates]
      properties:
        userid:
          type: string
          example: garret_heaton
        dates:
          type: array
          items:
            $ref: "#/components/schemas/BookedDate"
      example:
        userid: garret_heaton
        dates:
          - date: "20151201"
            movies: [267eedb8-0f5d-42d5-8f43-72426b9fb3e6]
          - date: "20151202"
            movies: [276c79ec-a26a-40a6-b3d3-fb242a5947b6]

    Movie:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        rating:
          type: number
          format: float
        director:
          type: string

    DetailedUserBookings:
      type: object
      properties:
        userid:
          type: string
        dates:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              movies:
                type: array
                items:
                  $ref: "#/components/schemas/Movie"
      example:
        userid: garret_heaton
        dates:
          - date: "20151201"
            movies:
              - id: 267eedb8-0f5d-42d5-8f43-72426b9fb3e6
                title: Creed
                rating: 8.8
                director: Ryan Coogler
          - date: "20151202"
            movies:
              - id: 276c79ec-a26a-40a6-b3d3-fb242a5947b6
                title: The Danish Girl
                rating: 5.3
                director: Tom Hooper

    MovieBookings:
      type: object
      properties:
        movieid:
          type: string
          example: 267eedb8-0f5d-42d5-8f43-72426b9fb3e6
        bookings:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              users:
                type: array
                items:
                  type: string
          example:
            - date: "20151201"
              users: [chris_rivers, garret_heaton, dwight_schrute]
